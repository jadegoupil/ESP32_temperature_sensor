;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 9600
lib_deps =
    adafruit/Adafruit SHT31 Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

# adafruit libraries : 
# adafruit is a collection of libraries for various sensors and displays. They provide easy-to-use functions to interface with different hardware components.
# SSD1306 : it is a library for the SSD1306 OLED display driver. It provides functions to control and display graphics on OLED screens.
# SHT31 : it is a library for the SHT31 temperature and humidity sensor. It provides functions to read temperature and humidity values from the sensor.
# GFX : it is a library for graphics rendering on OLED screens.